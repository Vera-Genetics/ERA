# Full-container development environment for ERA.
#
# Requires Docker Desktop with WSL integration enabled for your distro
# (Settings -> Resources -> WSL Integration). Run these commands from the WSL
# shell with the repo checked out on the Linux filesystem - bind mounts from
# \\wsl.localhost paths under Windows are extremely slow.
#
#   docker compose up --build
#
# The server container creates and loads the database automatically on first
# boot (bin/rails db:prepare in the entrypoint).
#
# Frontend:  http://localhost:4200
# GraphiQL:  http://localhost:3000/api/graphiql
# Sidekiq:   http://localhost:3000/jobs
#
# The database starts empty (db/seeds.rb has no data yet). To make search work:
#   docker compose exec server bin/rails searchkick:reindex:all

name: era

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:7.17.22
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0 -p 3000
    environment: &rails-env
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RAILS_DEVELOPMENT_HOSTS: .localhost,localhost,127.0.0.1
    ports:
      - "3000:3000"
    volumes:
      - ./server:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  sidekiq:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: bundle exec sidekiq
    environment: *rails-env
    volumes:
      - ./server:/rails
      - bundle:/usr/local/bundle
    depends_on:
      - server

  client:
    image: node:22-bookworm
    working_dir: /client
    # Source maps are disabled here: the webpack dev builder needs ~2x the heap
    # with them on, which OOMs inside the container. Debug against a native
    # `yarn start` when you need source maps.
    command: sh -c "yarn install --frozen-lockfile && yarn ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.docker.json --source-map=false --vendor-chunk=false"
    init: true
    shm_size: "1gb"
    environment:
      NG_CLI_ANALYTICS: "false"
      NODE_OPTIONS: "--max-old-space-size=6144"
    ports:
      - "4200:4200"
    volumes:
      - ./client:/client
      - client-node-modules:/client/node_modules
    depends_on:
      - server

volumes:
  db-data:
  bundle:
  client-node-modules:
