default: &default
  adapter: postgresql
  pool: 5
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", nil) %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", nil) %>

development:
  <<: *default
  database: civic_development

test:
  <<: *default
  database: civic_test
  <% if ENV['CI_BUILD'] %>
  username: postgres
  password: 'ci'
  <% end %>

# production/staging pulled username+password from Rails credentials upstream,
# but that requires the original CIViC master key, which a fork does not have.
# Set DATABASE_URL (or DATABASE_HOST/USERNAME/PASSWORD, from `default` above)
# instead.
production:
  <<: *default
  pool: 20

staging:
  <<: *default
  pool: 20
  database: civic_staging

headless:
  <<: *default
  pool: 20

